
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameVerse | Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #061426;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: #112b45;
      border: 1px solid #168fe0;
      border-radius: 18px;
    }
    h1 { color: #36b5ff; text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #168fe0;
      border-radius: 9px;
      background: #071a2d;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #159bea;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { text-align: center; line-height: 1.5; }
    a { color: #36b5ff; }
    .back { text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>🎮 GameVerse</h1>
    <h2>Create Account</h2>

    <form id="signup-form">
      <input id="username" placeholder="Choose a username"
        maxlength="20" required>
      <input id="signup-email" type="email"
        placeholder="Email address" required>
      <input id="signup-password" type="password"
        placeholder="Password (at least 6 characters)"
        minlength="6" required>
      <button type="submit">Create Account</button>
    </form>

    <hr>

    <h2>Login</h2>
    <form id="login-form">
      <input id="login-email" type="email"
        placeholder="Email address" required>
      <input id="login-password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message"></p>

    <div class="back">
      <a href="index.html">← Back to GameVerse</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    const message = document.getElementById("message");

    document.getElementById("signup-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value;

        if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
          message.textContent =
            "Username must be 3–20 characters using letters, numbers, or underscores.";
          return;
        }

        message.textContent = "Creating your account...";

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { username },
            emailRedirectTo: window.location.href.replace(
              /auth\.html(?:\?.*)?$/,
              "index.html"
            )
          }
        });

        if (error) {
          message.textContent = error.message;
        } else if (data.session) {
          message.textContent = "Account created! Welcome to GameVerse!";
          setTimeout(() => location.href = "index.html", 1500);
        } else {
          message.textContent =
            "Account created! Check your email for a confirmation link.";
        }
      });

    document.getElementById("login-form")
      .addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;

        message.textContent = "Logging in...";

        const { error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          message.textContent = error.message;
        } else {
          message.textContent = "Login successful!";
          setTimeout(() => location.href = "index.html", 1000);
        }
      });
  </script>
</body>
</html>
